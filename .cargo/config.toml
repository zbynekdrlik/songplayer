# #328 (dstack#366, dstack >= v0.6.164): every process cargo runs here —
# cargo test, nextest, cargo-mutants — serves a test Dante device on
# 127.0.0.1 and the stack refuses any other address, so no test announces
# mDNS onto a box's real networks. A live test on a real network sets
# DSTACK_LIVE_TEST=1 itself. Production never has this variable.
[env]
DSTACK_TEST_LOOPBACK = "1"
