[package]
name = "sp-gpu"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
sp-core = { path = "../sp-core" }
thiserror = { workspace = true }
tracing = { workspace = true }

# #223 S1a: Direct3D 11 + DXGI + the runtime HLSL compiler (d3dcompiler_47,
# shipped with Windows) — the same `windows` 0.58 sp-decoder and sp-ndi use.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
] }

[dev-dependencies]
# Placeholder crate that defines the `mutants::skip` attribute as a no-op,
# letting cargo-mutants exclude specific functions from mutation testing.
mutants = "0.0.4"
