[package]
name = "sp-server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "sp-server"
path = "src/main.rs"

[dependencies]
sp-core = { path = "../sp-core" }
sp-ndi = { path = "../sp-ndi" }
sp-decoder = { path = "../sp-decoder" }
# #223 S2: the SP-program-MAX GPU compositor + its Spout sender (Windows; the
# off-Windows stub reports `Unsupported`), driven by `playback/program_max*.rs`.
sp-gpu = { path = "../sp-gpu" }
# #233: the ASIO output's rubato sinc stage, in its own crate so it is
# compiled optimized in tests too (`playback/asrc.rs`).
sp-asrc = { path = "../sp-asrc" }

tokio = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true }
sqlx = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
# #184 round G: `raw_value` lets `api/preview.rs::pong_frame` echo the ping number
# byte-for-byte (default float parsing is best-effort, not round-trip exact).
serde_json = { workspace = true, features = ["raw_value"] }
# #221 L2b: the remote control speaks obs-websocket's `obswebsocket.msgpack`
# too — Companion's obs-studio module (Node) offers only that. A session's
# messages are the same `serde_json::Value` objects, MessagePack-encoded
# (`remote/codec.rs`). 1.3.1 + rmp 0.8.15 need only serde + num-traits, both
# already locked.
rmp-serde = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tokio-tungstenite = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
crossbeam-channel = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
regex = { workspace = true }
rand = { workspace = true }
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
urlencoding = "2"
socket2 = "0.6.3"
tempfile = "3.27.0"
# #15 part 2 live video preview. Pure-Rust JPEG encoder for the low-res
# preview frames (no C/system deps); used only by `playback/preview.rs`, off
# the program path.
jpeg-encoder = "0.6"
# #51 LAN sp.local advertisement. `mdns-sd` is a maintained pure-Rust mDNS-SD
# responder (no system Avahi/Bonjour daemon needed); `if-addrs` (the same crate
# mdns-sd uses internally) enumerates the host's interface IPs so we advertise
# the box's routable LAN IPv4 (never APIPA). Version-matched to mdns-sd's own
# if-addrs requirement so cargo unifies them into one build.
mdns-sd = "0.21"
if-addrs = "0.15"
# #233: the program audio outputs' sample-rate conversion — rubato's `Async`
# sinc (an ASIO output's drift-servo ratio, `playback/asrc.rs`: its filter
# here, the stage itself in sp-asrc) and its
# synchronous `Fft` (default `fft_resampler` feature: a VBAN destination's
# fixed ratio, `playback/vban_rate.rs`). Pure Rust, MIT OR Apache-2.0 (its MIT notice
# ships in THIRD-PARTY-NOTICES.txt), pinned exactly.
rubato = "=5.0.1"
# #233 lane 3: the lock-free single-producer / single-consumer ring between
# an ASIO output's worker and its driver's buffer-switch callback (the
# callback only copies: no allocation, lock or syscall). No dependencies,
# MIT OR Apache-2.0 (its MIT notice ships in THIRD-PARTY-NOTICES.txt),
# pinned exactly.
rtrb = "=0.4.0"
# #285: the native Dante output. dstack by tag, no Dante code in this repo.
# GPL-3.0-or-later: the owner's licence ruling is open on #285.
dante-stack = { git = "https://github.com/zbynekdrlik/dstack", tag = "v0.4.28" }
dante-audio-io = { git = "https://github.com/zbynekdrlik/dstack", tag = "v0.4.28" }
# #228: the SP-program burn-id QR (911014, #151's payload). Pure-Rust
# encoder; `default-features = false` drops the optional image / svg / pic
# renderers (the module matrix needs none). MIT OR Apache-2.0 (its MIT notice
# ships in THIRD-PARTY-NOTICES.txt), pinned exactly.
qrcode = { version = "=0.14.1", default-features = false }
# #259: Resolume Arena's saved output setup (its preferences and preset
# XML files, `wall/resolume.rs`). A read-only XML tree that refuses a DTD
# (no entity expansion); its only dependency, memchr, is already locked.
# MIT OR Apache-2.0 (its MIT notice ships in THIRD-PARTY-NOTICES.txt),
# pinned exactly.
roxmltree = "=0.21.1"

# #162: the box-overload guard's Windows OS calls — GlobalMemoryStatusEx for the
# pre-spawn memory-headroom read + a per-child Job Object (JOB_OBJECT_LIMIT_
# PROCESS_MEMORY + KILL_ON_JOB_CLOSE) so an OOMing heavy child dies, never the
# host. Thin FFI (windows-sys), mirroring sp-decoder's `windows` precedent;
# cfg(windows) only, so the Linux workspace build is untouched.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_SystemInformation",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    # #147 round 9: SetProcessWorkingSetSizeEx + QUOTA_LIMITS_HARDWS_* (hard min WS).
    "Win32_System_Memory",
    # #233 lane 3: an ASIO output's worker pumps its driver's window messages
    # (PeekMessageW / TranslateMessage / DispatchMessageW).
    "Win32_UI_WindowsAndMessaging",
    # #233 lane 3: the ASIO worker holds its thread's COM apartment
    # (CoInitializeEx / CoUninitialize) for its device's life.
    "Win32_System_Com",
    # #223 S12a: the video upgrade's disk floor (GetDiskFreeSpaceExW).
    "Win32_Storage_FileSystem",
    # #233: the box's one monotonic counter that SongPlayer and the ASIO host
    # both read (QueryPerformanceCounter, `audio_host/mono.rs`) and the check
    # that the host's pipe was opened by the host (GetNamedPipeClientProcessId).
    "Win32_System_Performance",
    "Win32_System_Pipes",
    # #233: the production-environment guard reads the Windows edition and
    # the firewall profiles from the registry (RegGetValueW, `prod_env_win.rs`).
    "Win32_System_Registry",
    # #233 review: the WinDefend service's state (OpenSCManagerW,
    # QueryServiceStatusEx): Defender stopped or uninstalled reads off.
    "Win32_System_Services",
    # #255: the audio profile finds Dante Virtual Soundcard's adapter by its
    # MAC among the network interfaces (GetIfTable2, MIB_IF_ROW2) and reads
    # the active power scheme (PowerGetActiveScheme, PowerReadACValueIndex),
    # with no process spawned (`prod_env_audio_win.rs`).
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_System_Power",
    # #259: the wall report reads Windows' displays (EnumDisplayDevicesW,
    # EnumDisplaySettingsW) and the process list (a Toolhelp snapshot) to
    # find Resolume Arena, with no process spawned (`wall/win.rs`; its
    # windows through Win32_UI_WindowsAndMessaging above).
    "Win32_Graphics_Gdi",
    "Win32_System_Diagnostics_ToolHelp",
    # #259 review: those reads run with the thread per-monitor DPI aware
    # (SetThreadDpiAwarenessContext), its previous awareness restored after.
    "Win32_UI_HiDpi",
] }
# #259: the wall report loads NVIDIA's System32\nvapi64.dll by its full path
# at run time (no NVIDIA SDK at build time; a box without the driver reads
# "no NVIDIA"), as sp-ndi loads NDI (`wall/win.rs`).
libloading = { workspace = true }
# #233: the production-environment guard reads Defender's real-time protection
# through WMI over COM (`prod_env_win.rs`: IWbemLocator, CoSetProxyBlanket),
# with no process spawned. The same `windows` 0.58 sp-decoder and sp-gpu use
# (already in the lock); windows-sys has no COM interfaces.
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Rpc",
    "Win32_System_Wmi",
] }
# #233 lane 3: the ASIO output's host — azo, a pure-Rust COM ASIO host (MIT,
# no Steinberg SDK, no LLVM; iemmixer's choice), 0.4.0 per main-session
# ruling 10 (finding 6046530840). Without its default `host` feature (a
# oneshot-based helper thread the output does not use). Pinned exactly; its
# MIT notice and azo-sys's ship in THIRD-PARTY-NOTICES.txt.
azo = { version = "=0.4.0", default-features = false }

[dev-dependencies]
tower = "0.5"
# #228: camera-box's own QR decoder (its recording-verdict reads the burn
# with it): the burn's round trip, decoded from the painted picture.
rqrr = { version = "=0.9.3", default-features = false }
wiremock = "0.6"
serial_test = "3"
tokio = { version = "1", features = ["full", "test-util"] }
# Placeholder crate that defines the `mutants::skip` attribute as a no-op,
# letting cargo-mutants exclude specific functions from mutation testing.
mutants = "0.0.4"
sp-ndi = { path = "../sp-ndi", features = ["test-util"] }
