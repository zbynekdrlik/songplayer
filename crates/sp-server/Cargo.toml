[package]
name = "sp-server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "sp-server"
path = "src/main.rs"

[dependencies]
sp-core = { path = "../sp-core" }
sp-ndi = { path = "../sp-ndi" }
sp-decoder = { path = "../sp-decoder" }

tokio = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true }
sqlx = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tokio-tungstenite = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
crossbeam-channel = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
regex = { workspace = true }
rand = { workspace = true }
zip = { version = "2", default-features = false, features = ["deflate"] }
urlencoding = "2"
socket2 = "0.6.3"
tempfile = "3.27.0"
# #151 burn-id QR overlay. Pure-Rust encoder; `default-features = false` drops
# the optional `image`/`svg` output renderers (no extra runtime deps, no
# advisories) — the core `QrCode`/`into_colors` API is not feature-gated and is
# all we need for the module matrix.
qrcode = { version = "0.14.1", default-features = false }
# #15 part 2 live video preview. Pure-Rust JPEG encoder for the low-res
# preview frames (no C/system deps, mirrors the `qrcode` pure-Rust precedent);
# used only by `playback/preview.rs` off the NDI submit path.
jpeg-encoder = "0.6"
# #51 LAN sp.local advertisement. `mdns-sd` is a maintained pure-Rust mDNS-SD
# responder (no system Avahi/Bonjour daemon needed); `if-addrs` (the same crate
# mdns-sd uses internally) enumerates the host's interface IPs so we advertise
# the box's routable LAN IPv4 (never APIPA). Version-matched to mdns-sd's own
# if-addrs requirement so cargo unifies them into one build.
mdns-sd = "0.21"
if-addrs = "0.15"

# #162: the box-overload guard's Windows OS calls — GlobalMemoryStatusEx for the
# pre-spawn memory-headroom read + a per-child Job Object (JOB_OBJECT_LIMIT_
# PROCESS_MEMORY + KILL_ON_JOB_CLOSE) so an OOMing heavy child dies, never the
# host. Thin FFI (windows-sys), mirroring sp-decoder's `windows` precedent;
# cfg(windows) only, so the Linux workspace build is untouched.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_SystemInformation",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
] }

[dev-dependencies]
tower = "0.5"
wiremock = "0.6"
serial_test = "3"
tokio = { version = "1", features = ["full", "test-util"] }
# Placeholder crate that defines the `mutants::skip` attribute as a no-op,
# letting cargo-mutants exclude specific functions from mutation testing.
mutants = "0.0.4"
sp-ndi = { path = "../sp-ndi", features = ["test-util"] }
