[package]
name = "sp-tauri"
version = "0.65.0-dev.22"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[[bin]]
name = "SongPlayer"
path = "src/main.rs"

[lib]
name = "sp_tauri_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
local-ip-address = "0.6"
dirs = "6"
sp-core = { path = "../crates/sp-core" }
sp-server = { path = "../crates/sp-server" }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tempfile = "3"

# src-tauri is EXCLUDED from the workspace, so the root Cargo.toml
# [profile.release] does NOT apply to the shipped SongPlayer.exe — it builds
# with cargo's default release profile (panic = "unwind", no debuginfo, no PDB).
# `debug = "line-tables-only"` makes rustc emit SongPlayer.pdb so the next WER
# minidump's SongPlayer.exe+<offset> frames resolve to file:line (#156). Only
# debuginfo is added — the panic strategy is unchanged (a behaviour change
# outside this ticket), and the PDB is a CI artifact, not bundled in the
# installer.
[profile.release]
debug = "line-tables-only"
